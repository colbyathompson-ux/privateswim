document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

transform:uppercase;color:var(--text-muted)\">3 Claim<\u002Fspan>\n        <\u002Fdiv>\n\n        <h1 style=\"font-family:var(--font-display);font-size:var(--text-4xl);color:var(--text-strong);letter-spacing:var(--tracking-tight);margin:0 0 var(--space-3)\">Who is swimming?<\u002Fh1>\n        <p style=\"margin:0 0 var(--space-8);color:var(--text-body);max-width:60ch\">Add every child you're signing up. You'll choose times for each one separately on the next step.<\u002Fp>\n\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-8);margin-bottom:var(--space-6)\">\n          <label style=\"display:block;font-size:var(--text-sm);font-weight:600;color:var(--text-strong);margin-bottom:var(--space-2)\">Parent / guardian email<\u002Flabel>\n          <input type=\"email\" value=\"{{ parentEmail }}\" sc-camel-on-change=\"{{ onParentEmail }}\" placeholder=\"you@example.com\" style=\"width:100%;height:44px;padding:0 var(--space-4);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);font-family:var(--font-core);font-size:var(--text-base);color:var(--text-strong);background:var(--white)\">\n          <p style=\"margin:var(--space-2) 0 0;font-size:var(--text-xs);color:var(--text-muted)\">Your confirmation and any schedule changes go here.<\u002Fp>\n        <\u002Fdiv>\n\n        <sc-for list=\"{{ childForms }}\" as=\"c\" hint-placeholder-count=\"1\">\n          <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-8);margin-bottom:var(--space-4)\">\n            <div style=\"display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-6)\">\n              <span style=\"font-size:var(--text-xs);font-weight:700;letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--text-accent)\">{{ c.title }}<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:var( \u002Fdiv>\n            <\u002Fdiv>\n            <label style=\"display:block;font-size:var(--text-sm);font-weight:600;color:var(--text-strong);margin-bottom:var(--space-2)\">What should the coach work on?<\u002Flabel>\n            <textarea value=\"{{ c.goals }}\" sc-camel-on-change=\"{{ c.onGoals }}\" rows=\"3\" placeholder=\"Comfortable in shallow water but afraid to put her face in. Goal: freestyle with side breathing by the end of the session.\" style=\"width:100%;padding:var(--space-3) var(--space-4);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);font-family:var(--font-core);font-size:var(--text-sm);line-height:var(--leading-relaxed);color:var(--text-strong);background:var(--white);resize:vertical\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <button sc-camel-on-click=\"{{ addChild }}\" style=\"width:100%;height:54px;background:transparent;color:var(--navy-700);border:2px dashed var(--navy-300);border-radius:var(--radius-lg);font-family:var(--font-core);font-size:var(--text-sm);font-weight:700;letter-spacing:var(--tracking-wider);text-transform:uppercase;cursor:pointer;margin-bottom:var(--space-6)\">+ Add another swimmer<\u002Fbutton>\n\n        <div sc-camel-on-click=\"{{ toggleWaiver }}\" style=\"display:flex;gap:var(--space-4);align-items:flex-start;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-6);cursor:pointer;margin-bottom:var(--space-6)\">\n          <span style=\"{{ waiverBoxStyle }}\">{{ waiverMark }}<\u002Fspan>\n          <span style=\"font-size:var(--text-sm);line-height:var(--leading-relaxed);color:var(--text-body)\">I confirm I am the parent or legal guardian, I accept the CYC aquatics liability waiver and photo release,.<\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ childErr }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:var(--danger-100);border-left:6px solid var(--danger-600);border-radius:var(--radius-sm);padding:var(--space-4) var(--space-5);margin-bottom:var(--space-5);font-size:var(--text-sm);font-weight:600;color:var(--danger-600)\">{{ childErr }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;gap:var(--space-3);flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ submitChildren }}\" style=\"display:inline-flex;align-items:center;justify-content:center;height:54px;padding:0 var(--space-8);background:var(--action-primary);color:var(--text-inverse);border:2px solid var(--action-primary);border-radius:var(--radius-pill);font-family:var(--font-core);font-size:var(--text-base);font-weight:700;letter-spacing:var(--tracking-wider);text-transform:uppercase;cursor:pointer;line-height:1\">Continue to times<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goHome }}\" style=\"display:inline-flex;align-items:center;justify-content:center;height:54px;padding:0 var(--space-8);background:transparent;color:var(--navy-700);border:2px solid var(--navy-700);border-radius:var(--radius-pill);font-family:var(--font-core);font-size:var(--text-base);font-weight:700;letter-spacing:var(--tracking-wider);text-transform:uppercase;cursor:pointer;line-height:1\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isSchedule }}\" hint-placeholder-val=\"{{ true }}\">\n    <main data-screen-label=\"Step 2 — Available times\" style=\"flex:1;padding:var(--space-10) var(--gutter) 160px;background:var(--surface-sunken)\">\n      <div style=\"max-width:1200px;margin:0 auto\">\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-8);flex-wrap:wrap;margin-bottom:var(--space-8)\">\n          <div>\n            <span style=\"font-size:var(--text-xs);font-weight:700;letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--text-accent)\">Available private lessons<\u002Fspan>\n            <h1 style=\"font-family:var(--font-display);font-size:var(--text-4xl);color:var(--text-strong);letter-spacing:var(--tracking-tight);margin:var(--space-3) 0 0\">{{ scheduleHeading }}<\u002Fh1>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ refresh }}\" style=\"display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 var(--space-6);background:transparent;color:var(--navy-700);border:2px solid var(--navy-700);border-radius:var(--radius-pill);font-family:var(--font-core);font-size:var(--text-sm);font-weight:700;letter-spacing:var(--tracking-wider);text-transform:uppercase;cursor:pointer;line-height:1\">{{ refreshLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasChildren }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-6);margin-bottom:var(--space-8)\">\n            <div style=\"display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4)\">\n              <span style=\"font-size:var(--text-xs);font-weight:700;letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--text-muted)\">Scheduling for<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:var(--border-subtle)\"><\u002Fspan>\n              <button sc-camel-on-click=\"{{ goChildren }}\" style=\"background:none;border:0;padding:0;font-family:var(--font-core);font-size:var(--text-xs);font-weight:700;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-link);cursor:pointer;text-decoration:underline;text-decoration-color:var(--gold-500);text-underline-offset:3px\">Edit swimmers<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:var(--space-3);flex-wrap:wrap\">\n              <sc-for list=\"{{ childTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.style }}\">\n                  <span style=\"display:block;font-size:var(--text-base);font-weight:800;letter-spacing:0;text-transform:none;line-height:1.2\">{{ t.name }}<\u002Fspan>\n                  <span style=\"{{ t.subStyle }}\">{{ t.sub }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ noChildren }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;align-items:center;gap:var(--space-6);flex-wrap:wrap;background:var(--surface-gold-soft);border:1px solid var(--gold-300);border-radius:var(--radius-lg);padding:var(--space-6) var(--space-8);margin-bottom:var(--space-8)\">\n            <span style=\"flex:1;min-width:280px;font-size:var(--text-sm);line-height:var(--leading-relaxed);color:var(--navy-700);font-weight:600\">You're browsing open times. Add your swimmer's details to start claiming spots.<\u002Fspan>\n            <button sc-camel-on-click=\"{{ goChildren }}\" style=\"display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 var(--space-6);background:var(--action-primary);color:var(--text-inverse);border:2px solid var(--action-primary);border-radius:var(--radius-pill);font-family:var(--font-core);font-size:var(--text-sm);font-weight:700;letter-spacing:var(--tracking-wider);text-transform:uppercase;cursor:pointer;line-height:1\">Add a swimmer<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ monthGroups }}\" as=\"m\" hint-placeholder-count=\"2\">\n          <section style=\"margin-bottom:var(--space-12)\">\n            <div style=\"display:flex;align-items:center;gap:var(--space-4);margin-bottom:var(--space-5)\">\n              <h2 style=\"font-family:var(--font-display);font-size:var(--text-2xl);color:var(--text-strong);letter-spacing:var(--tracking-tight);margin:0;text-transform:uppercase\">{{ m.label }}<\u002Fh2>\n              <span style=\"height:6px;flex:1;background:var(--gold-500);border-radius:3px\"><\u002Fspan>\n              <span style=\"font-size:var(--text-xs);font-weight:700;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-muted)\">{{ m.summary }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:var(--space-4)\">\n              <sc-for list=\"{{ m.dates }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <article style=\"{{ d.cardStyle }}\">\n                  <div style=\"display:flex;align-items:baseline;gap:var(--space-3);padding:var(--space-5) var(--space-6);border-bottom:1px solid var(--border-subtle);background:var(--surface-tint)\">\n                    <span style=\"font-family:var(--font-display);font-size:var(--text-2xl);color:var(--text-strong);line-height:1\">{{ d.dayNum }}<\u002Fspan>\n                    <div style=\"display:flex;flex-direction:column;gap:2px;margin-right:auto\">\n                      <span style=\"font-size:var(--text-sm);font-weight:700;color:var(--text-strong);line-height:1.1\">{{ d.weekday }}<\u002Fspan>\n                      <span style=\"font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-muted);line-height:1.1\">{{ d.monthShort }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <span style=\"{{ d.pillStyle }}\">{{ d.pillLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"padding:var(--space-5) var(--space-6) var(--space-6);display:flex;flex-direction:column;gap:var(--space-2)\">\n                    <sc-for list=\"{{ d.slots }}\" as=\"s\" hint-placeholder-count=\"4\">\n                      <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"{{ s.style }}\">\n                        <span style=\"display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left\">\n                          <span style=\"font-size:var(--text-sm);font-weight:700;letter-spacing:0;text-transform:none;line-height:1.2\">{{ s.time }}<\u002Fspan>\n                          <span style=\"{{ s.subStyle }}\">{{ s.sub }}<\u002Fspan>\n                        <\u002Fspan>\n                        <span style=\"{{ s.markStyle }}\">{{ s.mark }}<\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                    <div style=\"display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-2);font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-muted)\">{{ d.staffNote }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Farticle>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-for>\n\n        <sc-if value=\"{{ noDates }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center;padding:var(--space-24) var(--space-8);background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg)\">\n            <h2 style=\"font-family:var(--font-display);font-size:var(--text-2xl);color:var(--text-strong);margin:0 0 var(--space-3)\">No dates posted yet<\u002Fh2>\n            <p style=\"margin:0 auto;color:var(--text-muted);max-width:44ch\">The next block of private lessons hasn't been released. Check back soon or ask the front desk.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fmain>\n\n    <sc-if value=\"{{ hasPicks }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-noprint=\"\" style=\"position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface-navy);border-top:6px solid var(--gold-500);box-shadow:0 -12px 32px rgba(1,5,54,.28)\">\n        <div style=\"max-width:1200px;margin:0 auto;padding:var(--space-5) var(--gutter);display:flex;align-items:center;gap:var(--space-8);flex-wrap:wrap\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:var(--text-2xs);font-weight:700;letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--gold-400)\">Spots held for<\u002Fspan>\n            <span style=\"{{ timerStyle }}\">{{ timerText }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"width:1px;height:44px;background:var(--border-inverse)\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px;margin-right:auto;min-width:200px\">\n            <span style=\"font-size:var(--text-2xs);font-weight:700;letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--gold-400)\">Your roster<\u002Fspan>\n            <span style=\"font-size:var(--text-sm);font-weight:600;color:var(--white);line-height:1.35\">{{ pickSummary }}<\u002Fspan>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ clearPicks }}\" style=\"display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 var(--space-6);background:transparent;color:var(--white);border:2px solid rgba(254,254,254,.5);border-radius:var(--radius-pill);font-family:var(--font-core);font-size:var(--text-xs);font-weight:700;letter-spacing:var(--tracking-wider);text-transform:uppercase;cursor:pointer;line-height:1\">Clear all<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goReview }}\" style=\"display:inline-flex;align-items:center;justify-content:center;height:54px;padding:0 var(--space-8);background:var(--gold-500);color:var(--navy-700);border:2px solid var(--gold-500);border-radius:var(--radius-pill);font-family:var(--font-core);font-size:var(--text-base);font-weight:700;letter-spacing:var(--tracking-wider);text-transform:uppercase;cursor:pointer;line-height:1\">Review &amp; Claim<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isReview }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"Step 3 — Review\" style=\"flex:1;padding:var(--space-12) var(--gutter) var(--space-20);background:var(--surface-sunken)\">\n      <div style=\"max-width:840px;margin:0 auto\">\n        <span style=\"font-size:var(--text-xs);font-weight:700;letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--text-accent)\">Step 3 of 3<\u002Fspan>\n        <h1 style=\"font-family:var(--font-display);font-size:var(--text-4xl);color:var(--text-strong);letter-spacing:var(--tracking-tight);margin:var(--space-3) 0 var(--space-6)\">Confirm your roster<\u002Fh1>\n\n        <div style=\"display:flex;align-items:center;gap:var(--space-4);background:var(--surface-navy);border-radius:var(--radius-lg);padding:var(--space-5) var(--space-6);margin-bottom:var(--space-8)\">\n          <span style=\"font-size:var(--text-2xs);font-weight:700;letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--gold-400);margin-right:auto\">Hold expires in<\u002Fspan>\n          <span style=\"{{ timerStyle }}\">{{ timerText }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-for list=\"{{ reviewGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n          <section style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-top:6px solid var(--gold-500);border-radius:var(--radius-lg);padding:var(--space-8);margin-bottom:var(--space-5)\">\n            <div style=\"display:flex;align-items:baseline;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-5)\">\n              <h2 style=\"font-family:var(--font-display);font-size:var(--text-2xl);color:var(--text-strong);letter-spacing:var(--tracking-tight);margin:0\">{{ g.name }}<\u002Fh2>\n              <span style=\"font-size:var(--text-sm);color:var(--text-muted)\">{{ g.meta }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ g.goals }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0 0 var(--space-5);padding:var(--space-4) var(--space-5);background:var(--surface-sun ,\"Huang\",6,1],[\"Sabina\",\"Tsogoeva\",null,2],[\"Alan\",\"Tsogoeva\",null,3]],\n  \"2026-09-19\":[[\"Anson\",\"Chan\",null,0,\"adacsw@ymail.com\"],[\"Derek\",\"Coloma\",null,1,\"wcoloma7@icloud.com\"],[\"Tyler\",\"Coloma\",null,2,\"wcoloma7@icloud.com\"],[\"Cristobal\",\"Marietta\",null,3,\"marietta_15@hotmail.com\"],[\"Victor\",\"Marietta\",null,3,\"marietta_15@hotmail.com\"]],\n  \"2026-09-23\":[[\"Sophia\",\"Snider\",null,0],[\"Theia\",\"Tamborini\",3,0],[\"David\",\"Jones\",null,1],[\"Ethan\",\"McCraw\",null,1],[\"Emma\",\"Huang\",6,1],[\"Ella\",\"Huang\",6,1],[\"Priyal\",\"Patel\",null,2],[\"Sabina\",\"Tsogoeva\",null,2],[\"Alan\",\"Tsogoeva\",null,3]],\n  \"2026-09-26\":[[\"Anson\",\"Chan\",null,0,\"adacsw@ymail.com\"],[\"Derek\",\"Coloma\",null,1,\"wcoloma7@icloud.com\"],[\"Tyler\",\"Coloma\",null,2,\"wcoloma7@icloud.com\"]],\n  \"2026-09-30\":[[\"Sophia\",\"Snider\",null,0],[\"Theia\",\"Tamborini\",3,0],[\"David\",\"Jones\",null,1],[\"Ethan\",\"McCraw\",null,1],[\"Emma\",\"Huang\",6,1],[\"Ella\",\"Huang\",6,1],[\"Sabina\",\"Tsogoeva\",null,2],[\"Alan\",\"Tsogoeva\",null,3]],\n  \"2026-10-03\":[], \"2026-10-07\":[], \"2026-10-10\":[], \"2026-10-14\":[],\n  \"2026-10-17\":[], \"2026-10-21\":[], \"2026-10-24\":[], \"2026-10-28\":[], \"2026-10-31\":[]\n};\n\nconst MONTHS = [\"January\",\"February\",\"March\",\"April\",\"May\",\"June\",\"July\",\"August\",\"September\",\"October\",\"November\",\"December\"];\nconst DAYS = [\"Sunday\",\"Monday\",\"Tuesday\",\"Wednesday\",\"Thursday\",\"Friday\",\"Saturday\"];\n\nfunction parseISO(iso){ const p = String(iso).split(\"-\").map(Number); return new Date(p[0], p[1]-1, p[2]); }\nfunction fmt12(t){\n  const p = String(t).split(\":\"); let h = Number(p[0]); const m = p[1];\n  const ap = h >= 12 ? \"PM\" : \"AM\"; h = h % 12; if (h === 0) h = 12;\n  return h + \":\" + m + \" \" + ap;\n}\nfunction slotLabel(a, b){\n  const p1 = String(a).split(\":\"), p2 = String(b).split(\":\");\n  const ap1 = Number(p1[0]) >= 12 ? \"PM\" : \"AM\", ap2 = Number(p2[0]) >= 12 ? \"PM\" : \"AM\";\n  const base = fmt12(a).replace(\" \" + ap1, \"\") + \" – \" + fmt12(b).replace(\" \" + ap2, \"\");\n  return base + \" \" + ap2;\n}\nfunction uid(p){ return p + \"-\" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }\nfunction csvCell(v){ const s = v == null ? \"\" : String(v); return /[\",\\n]/.test(s) ? '\"' + s.replace(/\"/g, '\"\"') + '\"' : s; }\n\nfunction buildSeed(){\n  const dates = Object.keys(SEED).sort().map(function(iso){\n    const wd = parseISO(iso).getDay();\n    const times = wd === 6 ? SAT : WED;\n    return {\n      id: iso, lesson_date: iso, staff_count: 4,\n      slots: times.map(function(t){ return { id: iso + \"#\" + t[0], date_id: iso, start_time: t[0], end_time: t[1], capacity: null }; })\n    };\n  });\n  const bookings = [];\n  Object.keys(SEED).forEach(function(iso){\n    const wd = parseISO(iso).getDay(); const times = wd === 6 ? SAT : WED;\n    SEED[iso].forEach(function(r, i){\n      bookings.push({\n        id: iso + \"-b\" + i, slot_id: iso + \"#\" + times[r[3]][0],\n        child_first: r[0], child_last: r[1], child_age: r[2],\n        goals: \"Imported from the 2026 session schedule.\", parent_email: r[4] || \"\",\n        created_at: iso + \"T00:00:00.000Z\"\n      });\n    });\n  });\n  return { dates: dates, bookings: bookings, holds: [] };\n}\n\n/* ── Data layer ──────────────────────────────────────────────────────── */\nfunction localRead(){\n  try { const raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); } catch (e) {}\n  const seed = buildSeed();\n  try { localStorage.setItem(LS_KEY, JSON.stringify(seed)); } catch (e) {}\n  return seed;\n}\nfunction localWrite(d){ try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch (e) {} }\n\nclass Component extends DCLogic {\n  state = {\n    view: \"home\", loading: true, saving: false, syncing: false,\n    dates: [], bookings: [], holds: [],\n    draftDates: null, draft using local storage\", e); this.sb = null; }\n    }\n    await this.load();\n  }\n\n  async load(quiet){\n    if (!quiet) this.setState({ loading: true });\n    let data;\n    if (this.sb) {\n      try {\n        const res = await Promise.all([\n          this.sb.from(\"lesson_dates\").select(\"*\").order(\"lesson_date\"),\n          this.sb.from(\"lesson_slots\").select(\"*\").order(\"start_time\"),\n          this.sb.from(\"bookings\").select(\"*\"),\n          this.sb.from(\"holds\").select(\"*\")\n        ]);\n        const err = res.find(r => r.error);\n        if (err) throw err.error;\n        const slots = res[1].data || [];\n        data = {\n          dates: (res[0].data || []).map(d => Object.assign({}, d, {\n            slots: slots.filter(s => s.date_id === d.id).sort((a, b) => a.start_time < b.start_time ? -1 : 1)\n          })),\n          bookings: res[2].data || [],\n          holds: res[3].data || []\n        };\n        if (!data.dates.length) { data = buildSeed(); await this.pushSchedule(data.dates); await this.pushSeedBookings(data.bookings); }\n      } catch (e) { console.warn(\"Supabase read failed, falling back to local\", e); this.sb = null; data = localRead(); }\n    } else {\n      data = localRead();\n    }\n    const next = { dates: this.sortSchedule(data.dates), bookings: data.bookings, holds: data.holds || [], loading: false };\n    if (!this.state.dirty) { next.draftDates = this.sortSchedule(JSON.parse(JSON.stringify(next.dates))); next.draftBookings = JSON.parse(JSON.stringify(data.bookings)); }\n    this.setState(next);\n  }\n\n  async pushSchedule(dates){\n    if (!this.sb) return;\n    await this.sb.from(\"lesson_dates\").upsert(dates.map(d => ({ id: d.id, lesson_date: d.lesson_date, staff_count: d.staff_count })));\n    const slots = [];\n    dates.forEach(d => d.slots.forEach(s => slots.push({ id: s.id, date_id: d.id, start_time: s.start_time, end_time: s.end_time, capacity: s.capacity })));\n    await this.sb.from(\"lesson_slot is.updEdit(\"slot_id\", e.target.value),\n      closeEdit: () => this.setState({ editing: null }),\n      applyEdit: () => {\n        const e2 = s.editing; if (!e2) return;\n        const src = s.draftDates || s.dates;\n        const before = (s.draftBookings || s.bookings).find(x => x.id === e2.id);\n        const movedSlot = before && before.slot_id !== e2.slot_id;\n        let notice = null;\n        if (movedSlot) {\n          const prev = this.slotMeta(before.slot_id, src);\n          notice = this.noticeFor(\"changed\", e2, src, prev.date + \" · \" + prev.time);\n          notice.__id = e2.id;\n          this.queueNotice(notice);\n        }\n        this.mutateDraft((dd, db) => {\n          const t = db.find(x => x.id === e2.id);\n          if (t) {\n            t.child_first = e2.child_first; t.child_last = e2.child_last;\n            t.child_age = e2.child_age === \"\" || e2.child_age == null ? null : Number(e2.child_age);\n            t.goals = e2.goals; t.slot_id = e2.slot_id;\n          }\n          return { msg: notice && notice.email\n            ? \"Booking updated in the draft. Save changes to publish and email \" + notice.email + \".\"\n            : \"Booking updated in the draft. Save changes to publish.\" };\n        });\n        this.setState({ editing: null });\n      },\n\n      toast: s.toast,\n      dataModeLabel: this.sb ? \"Live · shared across all devices\" : LIVE ? \"Reconnecting to shared schedule…\" : \"Local preview mode · add Supabase keys to sync devices\"\n    };\n  }\n\n  updChild(key, field, val){\n    this.setState({ children: this.state.children.map(c => c.key === key ? Object.assign({}, c, { [field]: val }) : c), childErr: \"\" });\n  }\n  updEdit(field, val){\n    this.setState({ editing: Object.assign({}, this.state.editing, { [field]: val }) });\n  }\n  doLogin(){\n    if (this.state.coachPw === COACH_PASSWORD) { this.unlocked = true; this.setState({ view: \"coach\", coachPw: \"\", coachErr: \"\" }); }\n    else this.setState({ coachErr: \"Incorrect password.\" });\n  }\n  addSlot(){\n    const s = this.state;\n    if (!s.newDate) { this.setState({ coachMsg: \"Pick a date first.\", coachMsgKind: \"err\" }); return; }\n    if (!s.newStart || !s.newEnd || s.newEnd <= s.newStart) { this.setState({ coachMsg: \"End time must be after the start time.\", coachMsgKind: \"err\" }); return; }\n    this.mutateDraft(dd => {\n      let d = dd.find(x => x.id === s.newDate);\n      if (!d) { d = { id: s.newDate, lesson_date: s.newDate, staff_count: Number(s.newStaff) || 4, slots: [] }; dd.push(d); }\n      else d.staff_count = Number(s.newStaff) || 4;\n      const id = s.newDate + \"#\" + s.newStart;\n      if (d.slots.some(x => x.id === id)) return { msg: \"That time already exists on this date.\", kind: \"err\" };\n      d.slots.push({ id: id, date_id: d.id, start_time: s.newStart, end_time: s.newEnd, capacity: null });\n      return { msg: \"Added \" + slotLabel(s.newStart, s.newEnd) + \". Save changes to publish.\" };\n    });\n  }\n  addBulk(){\n    const s = this.state;\n    if (!s.bulkFrom || !s.bulkTo || s.bulkTo < s.bulkFrom) { this.setState({ coachMsg: \"Set a valid date range.\", coachMsgKind: \"err\" }); return; }\n    /* Typed times may be \"9:30\" — pad to \"09:30\" so string ordering matches clock order. */\n    const padTime = (t) => {\n      const m = String(t || \"\").match(/^(\\d{1,2}):(\\d{2})/);\n      return m ? String(Number(m[1])).padStart(2, \"0\") + \":\" + m[2] : \"\";\n    };\n    const times = s.bulkTimes.split(\"\\n\").map(l => l.trim()).filter(Boolean)\n      .map(l => l.split(/\\s*[-–]\\s*/).map(padTime))\n      .filter(p => p.length === 2 && p[0] && p[1] && p[1] > p[0]);\n    if (!times.length) { this.setState({ coachMsg: \"Add at least one valid time range, e.g. 15:45-16:15.\", coachMsgKind: \"err\" }); return; }\n    const wd = Number(s.bulkDay);\n    let added = 0;\n    this.mutateDraft(dd => {\n      const cur = parseISO(s.bulkFrom), end = parseISO(s.bulkTo);\n      while (cur <= end) {\n        if (cur.getDay() === wd) {\n          const iso = cur.getFullYear() + \"-\" + String(cur.getMonth() + 1).padStart(2, \"0\") + \"-\" + String(cur.getDate()).padStart(2, \"0\");\n          let d = dd.find(x => x.id === iso);\n          if (!d) { d = { id: iso, lesson_date: iso, staff_count: Number(s.bulkStaff) || 4, slots: [] }; dd.push(d); }\n          else d.staff_count = Number(s.bulkStaff) || 4;\n          times.forEach(t => {\n            const id = iso + \"#\" + t[0];\n            if (!d.slots.some(x => x.id === id)) { d.slots.push({ id: id, date_id: iso, start_time: t[0], end_time: t[1], capacity: null }); added++; }\n          });\n        }\n        cur.setDate(cur.getDate() + 1);\n      }\n      return { msg: added + \" slots generated across \" + DAYS[wd] + \"s. Save changes to publish.\" };\n    });\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
